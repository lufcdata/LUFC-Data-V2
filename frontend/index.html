<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LUFC Data</title>
    <style>
      html,body,#root{min-height:100%;margin:0}
      body{background:#f5f6f7;font-family:Arial,sans-serif}
      #bootstrap-status{margin:32px;padding:18px 20px;border:1px solid #dfe3e6;border-radius:12px;background:#fff;color:#161a1d;font-size:14px}
      #bootstrap-status strong{display:block;margin-bottom:6px}
      #bootstrap-error{margin-top:8px;color:#b42318;white-space:pre-wrap;font:12px/1.45 monospace}
    </style>
    <script>
      window.addEventListener('error', function (event) {
        var box = document.getElementById('bootstrap-error');
        if (box) box.textContent = 'JavaScript error: ' + (event.message || 'Unknown error');
      });
      window.addEventListener('unhandledrejection', function (event) {
        var box = document.getElementById('bootstrap-error');
        if (box) box.textContent = 'Unhandled promise rejection: ' + String(event.reason || 'Unknown error');
      });
    </script>
  </head>
  <body>
    <div id="root">
      <div id="bootstrap-status">
        <strong>LUFC Data bootstrap reached</strong>
        <div>Render build marker: 2026-09-01-bootstrap-diagnostic</div>
        <div id="bootstrap-error">Waiting for React to mount…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
