name: Validate V2 foundation

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: pytest -q
      - name: Audit player icon mapping
        env:
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_xlpwdDit8RCbCh1Yf-1XXQ_kYxAG_No
        run: python scripts/audit_player_icons.py
      - name: Upload player icon audit
        uses: actions/upload-artifact@v4
        with:
          name: player-icon-audit
          path: player_icon_audit.json

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache frontend node_modules
        id: frontend-node-modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node20-frontend-${{ hashFiles('frontend/package.json') }}
      - name: Install frontend dependencies
        if: steps.frontend-node-modules.outputs.cache-hit != 'true'
        run: npm install --no-audit --no-fund --prefer-offline
      - name: Generate frontend lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefer-offline
      - name: Commit frontend lockfile
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current"
          else
            git commit -m "Add frontend package lock"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - run: npm run build
