name: SofaScore fixture watch

on:
  schedule:
    # GitHub cron is UTC. Check once each day at 18:00 UK time equivalent.
    # Two seasonal UTC schedules are intentionally avoided here; 18:00 UTC means
    # 18:00 GMT in winter and 19:00 BST in summer, which is acceptable for a
    # once-daily fixture-change check. Match-day triggering will use the stored
    # live fixture time rather than frequent all-season polling.
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout scheduler branch
        uses: actions/checkout@v4
        with:
          ref: ui-bolt-opponents-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Discover next fixture and finished uncaptured match
        run: python scripts/sofascore_fixture_scheduler.py --no-collect
