name: SofaScore fixture watch

on:
  schedule:
    # GitHub cron is UTC. Trigger at both possible UTC equivalents of 18:00 UK,
    # then gate below using Europe/London so SofaScore is read exactly once at
    # 18:00 local time across both GMT and BST.
    - cron: '0 17 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  fixture-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gate scheduled run to 18:00 UK
        id: uk-time
        env:
          TZ: Europe/London
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date +%H)" = "18" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout scheduler branch
        if: steps.uk-time.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: ui-bolt-opponents-v1

      - name: Set up Python
        if: steps.uk-time.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore durable scheduler identity
        if: steps.uk-time.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source_data/sofascore
          artifact_id="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=sofascore-scheduler-state&per_page=100" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -z "$artifact_id" ]; then
            echo "No prior scheduler-state artifact found."
            exit 0
          fi
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            --output /tmp/sofascore-scheduler-state.zip
          unzip -o /tmp/sofascore-scheduler-state.zip -d source_data/sofascore
          test -f source_data/sofascore/scheduler_state.json
          echo "Restored scheduler identity from artifact ${artifact_id}."

      - name: Discover next fixture and finished uncaptured match
        if: steps.uk-time.outputs.run == 'true'
        run: python scripts/sofascore_fixture_scheduler.py --no-collect

      - name: Discover raw capture directories
        if: steps.uk-time.outputs.run == 'true'
        id: captures
        shell: bash
        run: |
          shopt -s nullglob
          dirs=(source_data/sofascore/*/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo 'matrix=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "${dirs[@]}" | python -c 'import json,sys; print("matrix=" + json.dumps([line.strip().rstrip("/").split("/")[-1] for line in sys.stdin if line.strip()]))' >> "$GITHUB_OUTPUT"

      - name: Preserve immutable SofaScore raw captures
        if: steps.uk-time.outputs.run == 'true' && steps.captures.outputs.matrix != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: sofascore-raw-${{ github.run_id }}
          path: source_data/sofascore/*/
          if-no-files-found: error
          retention-days: 14

      - name: Check scheduler state file
        if: steps.uk-time.outputs.run == 'true'
        id: state-file
        shell: bash
        run: |
          if [ -f source_data/sofascore/scheduler_state.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Preserve durable scheduler identity
        if: steps.uk-time.outputs.run == 'true' && steps.state-file.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sofascore-scheduler-state
          path: source_data/sofascore/scheduler_state.json
          if-no-files-found: error
          retention-days: 90

      - name: Report durable capture identities
        if: steps.uk-time.outputs.run == 'true'
        run: |
          echo "Raw capture event IDs present: ${{ steps.captures.outputs.matrix }}"
