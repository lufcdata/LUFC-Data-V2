name: SofaScore fixture watch

on:
  schedule:
    # GitHub cron is UTC. Trigger at both possible UTC equivalents of 18:00 UK,
    # then gate below using Europe/London so SofaScore is read exactly once at
    # 18:00 local time across both GMT and BST.
    - cron: '0 17 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gate scheduled run to 18:00 UK
        id: uk-time
        env:
          TZ: Europe/London
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date +%H)" = "18" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout scheduler branch
        if: steps.uk-time.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: ui-bolt-opponents-v1

      - name: Set up Python
        if: steps.uk-time.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Discover next fixture and finished uncaptured match
        if: steps.uk-time.outputs.run == 'true'
        run: python scripts/sofascore_fixture_scheduler.py --no-collect

      # Safety preparation for the future collection phase. Each provider event
      # becomes its own durable artifact, named by the SofaScore event ID. That
      # provider ID is an external identity only; it never occupies a LUFC
      # canonical match_id field.
      - name: Discover raw capture directories
        if: steps.uk-time.outputs.run == 'true'
        id: captures
        shell: bash
        run: |
          shopt -s nullglob
          dirs=(source_data/sofascore/*/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo 'matrix=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "${dirs[@]}" | python -c 'import json,sys; print("matrix=" + json.dumps([line.strip().rstrip("/").split("/")[-1] for line in sys.stdin if line.strip()]))' >> "$GITHUB_OUTPUT"

      - name: Preserve immutable SofaScore raw captures
        if: steps.uk-time.outputs.run == 'true' && steps.captures.outputs.matrix != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: sofascore-raw-${{ github.run_id }}
          path: source_data/sofascore/**
          if-no-files-found: error
          retention-days: 14

      - name: Report durable capture identities
        if: steps.uk-time.outputs.run == 'true'
        run: echo 'Raw capture event IDs present: ${{ steps.captures.outputs.matrix }}'
